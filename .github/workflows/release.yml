name: Build and deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Full SHA of a previously healthy release; empty = build and deploy main'
        required: false
        default: ''
        type: string
permissions:
  contents: read
# 同仓库不打断发布；跨仓库数据库迁移由服务器 flock 串行化。
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.rollback_sha == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saveb_ci
          POSTGRES_USER: saveb_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saveb_ci -d saveb_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: saveb_ci
      DB_USERNAME: saveb_ci
      DB_PASSWORD: ci-only-password
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, intl, zip, mbstring, dom, xml, xmlwriter, gd, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Unit and isolated PostgreSQL regression tests
        shell: bash
        run: |
          set -euo pipefail
          php vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php tests/Unit
          for suite in rbac orders dashboard workbench local collector; do
            php vendor/bin/phpunit -c "phpunit-$suite.xml"
          done
      - name: Release failure and recovery tests
        run: python3 automation/test_release.py
  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: GHCR image name
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push exact commit
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
  deploy:
    needs: [test, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' &&
      (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.rollback_sha != ''))
    runs-on: [self-hosted, Linux, X64, saveb-production]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip superseded main pushes
        id: fresh
        uses: actions/github-script@v7
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        with:
          script: |
            if (process.env.ROLLBACK_SHA) { core.setOutput('deploy', 'true'); return; }
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            core.setOutput('deploy', String(data.commit.sha === context.sha));
            if (data.commit.sha !== context.sha) core.notice('A newer main commit exists; skipping this deployment.');
      - name: Pull image, back up, migrate and activate
        if: steps.fresh.outputs.deploy == 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          app="$(cat automation/app.id)"
          root="/home/admin_chen/www/$app"
          test -f "$root/.deploy-ready"
          # 凭据只存在本项目临时目录，既不改 ~/.docker，也不使用 SSH 私钥。
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "$root/.ghcr-auth-XXXXXX")"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN
          if [[ -n "$ROLLBACK_SHA" ]]; then
            bash automation/release.sh "$root" "$ROLLBACK_SHA" rollback
          else
            bash automation/release.sh "$root" "$GITHUB_SHA" deploy "$IMAGE_NAME@$IMAGE_DIGEST"
          fi
      - name: Deployment result
        if: always()
        shell: bash
        env:
          REVISION: ${{ inputs.rollback_sha || github.sha }}
          FRESH: ${{ steps.fresh.outputs.deploy }}
        run: |
          printf 'Revision: `%s`\nEligible to deploy: `%s`\nDatabase migrations are never automatically reversed.\n' "$REVISION" "$FRESH" >> "$GITHUB_STEP_SUMMARY"
