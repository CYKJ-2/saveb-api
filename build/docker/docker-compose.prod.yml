# ============================================================
# SAVEB ERP API — Production (Server Override)
# ============================================================
#
# 这是 **生产服务器** 用的 Docker Compose override 文件。
# 与本地开发的区别：
#
#   ✗ 不映射宿主端口（容器间通过 Docker 网络互通，前置 Nginx / SLB 转发）
#   ✗ 不挂载源码（容器镜像本身即应用，git pull 后重建镜像）
#   ✓ 添加资源限制，避免单个容器占用全部宿主机资源
#   ✓ 强制 restart: always（除非手动 docker compose stop，否则一直重启）
#   ✓ 使用生产 nginx 配置（含 HTTPS / 限流 / 安全头）
#   ✓ 队列 worker 单独作为 long-running service 启动
#
# 启动命令（服务器上 .env 已软链接到 build/env/.prod.env）：
#   docker compose -f docker-compose.yml -f build/docker/docker-compose.prod.yml up -d --build
#
# ⚠️ 此文件应提交到 git。含敏感信息（密钥）的 build/env/.prod.env 不要提交。
# ============================================================

# 文件位置 build/docker/，但相对路径按 cwd（项目根）解析，与根目录 docker-compose.yml 一致

services:
  # ── 生产 PHP-FPM ────────────────────────────────────────────
  app:
    # 生产不使用 build:（本地 build 在 docker-compose.local.yml 里）
    # image: 继承 base 的 ghcr.io/YOUR_ORG/saveb-api-app:${IMAGE_TAG}
    # 运行时不挂载源码卷，镜像本身 = 版本
    command: ["php-fpm", "-F", "--fpm-config", "/usr/local/etc/php-fpm.d/zz-docker.conf"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: always
    read_only: false   # php-fpm 需要写 /tmp
    tmpfs:
      - /tmp
    # 生产不挂载宿主机源码！
    # 镜像本身 = 应用版本，docker build 出来的镜像就是 immutable deployment artifact。
    volumes:
      # 仅保留运行时需要的目录作为命名卷（避免重建容器丢失日志/缓存）
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    healthcheck:
      # 通过 php -r 直接调用 SAPI 检查 Laravel 是否能启动
      test: ["CMD-SHELL", "php -r \"echo PHP_VERSION;\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 生产 PostgreSQL ─────────────────────────────────────────
  postgres:
    # 生产不应该把数据库端口暴露到宿主机！通过 Docker 网络访问即可
    # 注释掉 ports: 容器间互通使用 `saveb-api-postgres:5432`
    # ports:
    #   - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动自动跑 SQL（按 cwd = 项目根 的相对路径 ./build/sql/）
      - ./build/sql:/docker-entrypoint-initdb.d:ro

  # ── 生产 Redis ──────────────────────────────────────────────
  redis:
    # 生产不应该把 Redis 端口暴露到宿主机
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    restart: always

  # ── 生产 Nginx ──────────────────────────────────────────────
  nginx:
    # 生产 Nginx 不暴露 80 端口（SLB / 边缘 Nginx 转发 443）
    # 但容器内部仍监听 80 仅供 SLB 直连 container。如果你想让这个 nginx 直连公网，请解开下面的端口并改用 .env 中的 NGINX_PORT=443
    # ports:
    #   - "${NGINX_PORT:-443}:443"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    restart: always
    volumes:
      # 生产 nginx 配置（含 SSL / HSTS / 限流）（按 cwd = 项目根 的相对路径）
      - ./build/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书挂载（如果 nginx 直接接公网）
      # - /etc/letsencrypt:/etc/letsencrypt:ro

  # ── 生产 Queue Worker（长驻进程） ────────────────────────────
  # Laravel 队列需要在后台持续运行 `php artisan queue:work`。
  # 在生产环境作为独立 service 跑，避免和 web 请求抢资源。
  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/YOUR_ORG}/saveb-api-app:${IMAGE_TAG:-local}
    container_name: saveb-api-worker
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_TIMEZONE=${APP_TIMEZONE}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CLIENT=${REDIS_CLIENT}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - LOG_CHANNEL=${LOG_CHANNEL}
      - LOG_STACK=${LOG_STACK}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      # worker 不需要读写 web 资源，只需要日志目录
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saveb-api-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      restart_policy:
        condition: on-failure
    restart: always
    # 不需要映射端口，worker 只在内部网络跑

volumes:
  app_storage:
  app_cache:
