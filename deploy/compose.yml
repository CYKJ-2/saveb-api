x-app: &app
  image: ${RELEASE_IMAGE:?immutable image required}
  env_file: ${DEPLOY_ROOT}/.env
  restart: unless-stopped
  networks: [business]
  volumes:
    - storage:/var/www/html/storage
    - attachments:/data/attachments

services:
  app:
    <<: *app
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD", "php", "/var/www/html/deploy/health.php"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
  web:
    <<: *app
    command: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:${API_PORT:-18080}:8080"]
    networks:
      business:
        aliases: [saveb-api-web]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 6s
      retries: 10
    depends_on:
      app:
        condition: service_healthy
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]
  migrate:
    <<: *app
    restart: "no"
    profiles: [tools]
    command: ["php", "artisan", "migrate", "--force"]
networks:
  business:
    external: true
    name: ${DEPLOY_NETWORK:-saveb-production}
volumes:
  storage:
    name: ${API_STORAGE_VOLUME:-saveb-api-production-storage}
  attachments:
    name: ${ATTACHMENTS_VOLUME:-saveb-production-attachments}
