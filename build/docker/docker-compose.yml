# ============================================================
# SAVEB ERP API — Docker Compose (Base)
# ============================================================
#
# 这是 **主文件**。
#
# 启动命令（必须 cd 到项目根目录执行）：
#
#   本地开发：
#     docker compose -f docker-compose.yml -f build/docker/docker-compose.local.yml up -d --build
#
#   生产部署：
#     docker compose -f docker-compose.yml -f build/docker/docker-compose.prod.yml up -d --build
#
# .env 文件是符号链接：
#   本地   → build/env/.local.env
#   服务器 → build/env/.prod.env
#
# 配置文件结构（build/）：
#   build/docker/docker-compose.yml        — 共享 base
#   build/docker/docker-compose.local.yml  — 本地 override
#   build/docker/docker-compose.prod.yml  — 生产 override
#   build/env/.local.env                  — 本地环境变量
#   build/env/.prod.env                   — 生产环境变量
#   build/nginx/nginx.local.conf          — 本地 nginx 配置
#   build/nginx/nginx.prod.conf           — 生产 nginx 配置
#   build/Dockerfile                      — PHP 镜像定义
# ============================================================

services:
  # ── PHP-FPM 应用服务 ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: build/Dockerfile
    image: ${IMAGE_REGISTRY:-ghcr.io/YOUR_ORG}/saveb-api-app:${IMAGE_TAG:-local}
    container_name: saveb-api-app
    volumes:
      - .:/var/www/html
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_TIMEZONE=${APP_TIMEZONE}
      - APP_URL=${APP_URL}
      # 数据库
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis
      - REDIS_CLIENT=${REDIS_CLIENT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      # 队列/缓存/会话
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - SESSION_LIFETIME=${SESSION_LIFETIME}
      # CORS
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOW_PRIVATE_NETWORK=${CORS_ALLOW_PRIVATE_NETWORK}
      # 邮件
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      # 文件上传
      - UPLOAD_DISK=${UPLOAD_DISK}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saveb-api-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── PostgreSQL 数据库 ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saveb-api-postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - saveb-api-net

  # ── Redis 缓存/队列 ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saveb-api-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - saveb-api-net

  # ── Nginx Web 服务器 ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: saveb-api-nginx
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - saveb-api-net

networks:
  saveb-api-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
