# 本地独立运行，无需旧 saveb-erp 容器、网络或数据卷。
services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile.local
    image: saveb-api-app:local
    command: ["sh", "build/php/start-business.sh"]
    environment:
      BUSINESS_ATTACHMENTS_ROOT: /data/attachments
    volumes:
      - business_attachments:/data/attachments
    restart: unless-stopped
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    restart: unless-stopped
  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    restart: unless-stopped
  nginx:
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./build/nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
volumes:
  business_attachments:
