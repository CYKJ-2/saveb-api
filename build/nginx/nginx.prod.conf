# SAVEB API - Production Nginx Config
# 部署前请替换以下内容：
#   - server_name 为实际域名
#   - SSL 证书路径（如果 Nginx 直连公网，取消 ssl_ 开头的注释）
#
# 挂载方式：docker-compose.yml 中 volumes:
#   ./build/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

# ── HTTP → HTTPS 重定向（如果前端有独立负载均衡可注释掉） ──
server {
    listen 80;
    server_name api.saveb.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主站 ──
server {
    listen 443 ssl;
    # ssl_certificate     /etc/ssl/certs/api.saveb.com.pem;
    # ssl_certificate_key /etc/ssl/private/api.saveb.com.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # ssl_prefer_server_ciphers on;

    server_name api.saveb.com;

    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    # 生产环境移除 access_log 或改为专用日志路径
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    index index.php;

    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # 请求限流（避免 CC 攻击）
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req zone=api burst=60 nodelay;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # 生产环境安全头
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(eot|otf|ttf|woff|woff2)$ {
        add_header Access-Control-Allow-Origin *;
    }
}
