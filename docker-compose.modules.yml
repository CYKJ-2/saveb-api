# Local migration integration. Reuses the existing attachment volume and OCR engine.
# docker network create saveb-business-services
# docker network connect saveb-business-services saveb-erp-dev-ocr-engine-1
# docker compose -f docker-compose.yml -f docker-compose.modules.yml up -d --no-deps app
services:
  app:
    image: saveb-api-app:local
    command: ["sh", "/var/www/html/docker/start-local.sh"]
    environment:
      BUSINESS_ATTACHMENTS_ROOT: /data/attachments
      BUSINESS_OCR_URL: http://saveb-erp-dev-ocr-engine-1:8081
    volumes:
      - legacy_attachments:/data/attachments
      - ./docker/business-uploads.ini:/usr/local/etc/php/conf.d/business-uploads.ini:ro
    networks:
      - business-services
volumes:
  legacy_attachments:
    external: true
    name: saveb-erp-dev_attachments
networks:
  business-services:
    external: true
    name: saveb-business-services
