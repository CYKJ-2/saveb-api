name: saveb-api-production
x-app: &app
  # 生产只运行 GitHub 构建的镜像；未指定版本时直接报错，不能退回服务器构建。
  image: ${RELEASE_IMAGE:?Set RELEASE_IMAGE to the pulled GHCR image}
  env_file: ./.env
  restart: unless-stopped
  networks: [business]
  volumes:
    - storage:/var/www/html/storage
    - attachments:/data/attachments

services:
  app:
    <<: *app
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD", "php", "/var/www/html/docker/health.php"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
  web:
    <<: *app
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - storage:/var/www/html/storage
      - attachments:/data/attachments
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/saveb.conf
        read_only: true
        bind:
          create_host_path: false
    ports: ["127.0.0.1:${API_PORT:-18088}:8080"]
    networks:
      business:
        aliases: [saveb-api-web]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 6s
      retries: 10
    depends_on:
      app:
        condition: service_healthy
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]
  migrate:
    <<: *app
    restart: "no"
    profiles: [tools]
    command: ["php", "artisan", "migrate", "--force"]
networks:
  business:
    external: true
    name: ${DEPLOY_NETWORK:-saveb-production}
volumes:
  storage:
    name: ${API_STORAGE_VOLUME:-saveb-api-production-storage}
  attachments:
    name: ${ATTACHMENTS_VOLUME:-saveb-production-attachments}
