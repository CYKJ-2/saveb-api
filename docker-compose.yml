# 本地开发入口。生产镜像发布使用 docker-compose.server.yml；只维护根目录 .env、nginx.conf。
name: saveb-api
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: saveb-api-app:local
    container_name: saveb-api-app
    env_file: .env
    environment:
      BUSINESS_ATTACHMENTS_ROOT: /data/attachments
    volumes:
      - .:/var/www/html
      - business_attachments:/data/attachments
    command: ["sh", "docker/start-local.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [saveb-api-net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    container_name: saveb-api-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_DB: ${DB_DATABASE:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [saveb-api-net]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: saveb-api-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redis_data:/data]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [saveb-api-net]
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: saveb-api-nginx
    ports: ["127.0.0.1:${API_PORT:-${NGINX_PORT:-8080}}:8080"]
    volumes:
      - .:/var/www/html:ro
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on: [app]
    networks: [saveb-api-net]
    restart: unless-stopped
networks:
  saveb-api-net:
    driver: bridge
# 保持已有名称，继续使用本地数据库、Redis、附件，不能改名或 down -v。
volumes:
  postgres_data:
  redis_data:
  business_attachments:
