name: saveb-infra
# Provision once. Application releases never recreate or remove these database volumes.
services:
  postgres:
    image: ${INFRA_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?required}
      POSTGRES_USER: ${DB_USERNAME:?required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes: [postgres:/var/lib/postgresql/data]
    networks:
      business:
        aliases: [saveb-api-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: ${INFRA_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redis:/data]
    networks:
      business:
        aliases: [saveb-api-redis]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  collector-redis:
    image: ${INFRA_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [collector-redis:/data]
    networks:
      business:
        aliases: [saveb-collector-redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  business:
    name: ${DEPLOY_NETWORK:-saveb-production}
volumes:
  postgres:
    name: saveb-production-postgres
  redis:
    name: saveb-production-redis
  collector-redis:
    name: saveb-production-collector-redis
